[project]
name = "story"
version = "0.1.0"
description = "AI 即時生成劇情的文字冒險遊戲"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.30.1",
    "pydantic>=2.14.1",
    "textual>=8.2.8",
    "textual-serve>=1.1.3",
]

[project.scripts]
story = "story:main"
story-web = "story.web:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
