[project]
name = "story"
version = "0.1.0"
description = "A text adventure game whose story an AI writes as you play"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "google-genai>=2.30.1",
    "pydantic>=2.14.1",
]

[project.scripts]
story = "story:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai"]

[tool.ruff]
line-length = 200  # Long lines are fine (comments explain in full sentences); also keeps a commented import on one line

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]  # pycodestyle, pyflakes, import order, likely bugs, newer syntax
ignore = ["E501"]
