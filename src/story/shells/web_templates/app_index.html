<!DOCTYPE html>
<!--
  textual-serve 的 app_index.html，複製到這裡加上手機支援（web.py 用 templates_path 指定）：
  - viewport：沒有它手機會把頁面當成電腦網頁縮小顯示，字很小
  - 手機輸入列：xterm.js 和手機輸入法處理中文選字時會重複字，手機上改用一般的輸入框打字，
    按送出後用「貼上」把整段文字送進遊戲，再送一個 Enter
  - 手指上下滑動捲動故事：遊戲開著滑鼠模式時 xterm.js 不處理觸控滑動，這裡把滑動換成滑鼠滾輪送給遊戲
  電腦（主要指標不是觸控）完全不受影響。在電腦上想看手機版可以在網址加上 ?mobile=1。
  升級 textual-serve 時，要對照新版的模板看有沒有需要跟著改的地方。
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <script>
      // 手機版：主要指標是觸控（或網址有 ?mobile=1）
      if (matchMedia("(pointer: coarse)").matches || new URLSearchParams(location.search).get("mobile") === "1") {
        document.documentElement.classList.add("-touch");
      }
      // textual.js 在內部建立 websocket；先包一層，手機輸入列才能用同一條連線送字，
      // 也順便記下終端機的格數（滑動捲動時要把手指位置換算成第幾格）
      window.storyTerminalSize = { cols: 80, rows: 24 };
      window.StoryWebSocket = window.WebSocket;
      window.WebSocket = class extends window.StoryWebSocket {
        constructor(...args) {
          super(...args);
          window.storySocket = this;
        }
        send(data) {
          if (typeof data === "string" && data.startsWith('["resize"')) {
            const size = JSON.parse(data)[1];
            window.storyTerminalSize = { cols: size.width, rows: size.height };
          }
          super.send(data);
        }
      };
    </script>
    <link rel="stylesheet" href="{{ config.static.url }}css/xterm.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto%20Mono"
    />
    <script src="{{ config.static.url }}js/textual.js"></script>
    <style>
      body {
        background: #0c181f;
      }

      .dialog-container {
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        box-shadow: var(--shadow-elevation-high);
      }
      .shade {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #0c181f;
        background-image: url("{{ config.static.url }}images/background.png");
      }
      .intro {
        width: 640px;
        height: 240px;
        font-size: 16px;
        z-index: 20;
        font-family: "Roboto Mono", menlo, monospace;
        text-align: center;
        opacity: 1;
        color: rgba(255, 255, 255, 0.95);
        background-color: #12232d;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 32px;
      }

      body.-first-byte .intro-dialog,
      body.-first-byte .intro-dialog .shade {
        opacity: 0;
        transition: opacity 0.3s ease-out;
        display: none;
      }

      body .textual-terminal {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }

      body.-first-byte .textual-terminal {
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }

      .intro svg {
        padding-right: 16px;
      }

      body Button {
        padding: 16px 32px;
        background-color: #5e0ba7;
        color: rgba(255, 255, 255, 0.95);
        border: none;
        font-family: "Roboto Mono", menlo, monospace;
        margin: 16px;
        display: block;
      }

      Button:hover {
        background: #ac5af4;
        cursor: pointer;
      }

      .closed-dialog {
        opacity: 0;
        display: none;
      }

      body.-closed .closed-dialog {
        opacity: 1;
        display: flex;
      }

      #start {
        display: none;
      }

      #start.-delay {
        display: flex;
      }

      /* ---------- 手機版 ---------- */
      #mobile-input {
        display: none;
      }

      /* 版面跟著可見區域（扣掉手機鍵盤）走：上面是終端機，下面是輸入列 */
      html.-touch body {
        position: fixed;
        left: 0;
        right: 0;
        top: var(--app-top, 0px);
        height: var(--app-height, 100vh);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      html.-touch .textual-terminal {
        flex: 1 1 auto;
        min-height: 0;
        height: auto !important;
      }

      html.-touch #mobile-input {
        display: flex;
        flex: 0 0 auto;
        gap: 8px;
        padding: 8px;
        background: #12232d;
      }

      #mobile-input input {
        flex: 1 1 auto;
        min-width: 0;
        font-size: 16px; /* 小於 16px 時 iPhone 會在點輸入框時自動放大畫面 */
        padding: 8px 12px;
        border: 1px solid #3b4261;
        border-radius: 8px;
        background: #1a1b26;
        color: #c0caf5;
      }

      #mobile-input button {
        margin: 0;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 16px;
        display: block;
      }
    </style>
    <script>
      function getStartUrl() {
        const url = new URL(window.location.href);
        const params = new URLSearchParams(url.search);
        params.delete("delay");
        return url.pathname + "?" + params.toString();
      }
      async function refresh() {
        const ping_url = document.body.dataset.pingurl;
        if (ping_url) {
          await fetch(ping_url, {
            method: "GET",
            mode: "no-cors",
          });
        }
        window.location.href = getStartUrl();
      }
    </script>
  </head>
  <body data-pingurl="{{ ping_url }}">
    <div class="dialog-container intro-dialog">
      <div class="shade"></div>
      <div class="intro">
        <svg
          width="32px"
          viewBox="0 0 2933 2261"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M2927.81 0H1677.1L1312.35 205.173H306.689L0.359375 434.921L204.029 893.177H735.972L644.784 2261H1060.36L1441.72 1974.97L2073.92 688.003H2334.4L2717.9 472.286L2927.81 0ZM1245.82 410.347L1276.32 277.656H330.85L153.929 410.347H1245.82ZM1229.16 482.83H100.972L251.134 820.694H813.449L722.26 2188.52H837.043L1229.16 482.83ZM1350.7 277.656L911.417 2188.52H1023.87L1662.19 615.52H2301.36L2451.52 277.656H1350.7ZM1460.19 205.173H2497.79L2733.69 72.4829H1696.09L1460.19 205.173Z"
            fill="#ffffff"
          />
        </svg>

        <div>{{ application.name or 'Textual Application' }}</div>
        <button type="button" onClick="refresh()" id="start">Start</button>
      </div>
    </div>

    <div class="dialog-container closed-dialog">
      <div class="shade"></div>
      <div class="intro">
        <div class="message">Session ended.</div>
        <button type="button" onClick="refresh()">Restart</button>
      </div>
    </div>

    <div
      id="terminal"
      class="textual-terminal"
      data-session-websocket-url="{{ app_websocket_url }}"
      data-font-size="{{ font_size }}"
    ></div>

    <form id="mobile-input" autocomplete="off">
      <input
        id="mobile-text"
        type="text"
        enterkeyhint="send"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="輸入行動或數字；空白送出＝Enter"
      />
      <button type="submit">送出</button>
    </form>

    <script>
      (function () {
        if (!document.documentElement.classList.contains("-touch")) return;
        const root = document.documentElement;
        const form = document.getElementById("mobile-input");
        const field = document.getElementById("mobile-text");

        // 版面高度跟著可見區域（手機鍵盤打開時會變矮），再請 textual.js 重新計算終端機大小
        function layout() {
          const view = window.visualViewport;
          root.style.setProperty("--app-height", (view ? view.height : window.innerHeight) + "px");
          root.style.setProperty("--app-top", (view ? view.offsetTop : 0) + "px");
          if (typeof window.onresize === "function") window.onresize();
        }
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", layout);
          window.visualViewport.addEventListener("scroll", layout);
        }
        window.addEventListener("orientationchange", () => setTimeout(layout, 300));
        layout();

        // 點終端機畫面時不叫出鍵盤（打字一律用下面的輸入列），點選項照常有效
        new MutationObserver(() => {
          const helper = document.querySelector("#terminal .xterm-helper-textarea");
          if (helper && helper.getAttribute("inputmode") !== "none") {
            helper.setAttribute("inputmode", "none");
          }
        }).observe(document.getElementById("terminal"), { childList: true, subtree: true });

        // 手指上下滑動：換成滑鼠滾輪（SGR 格式）送給遊戲，捲動手指底下的區塊。只是點一下時照常當作點擊
        const terminal = document.getElementById("terminal");
        let lastY = null;
        let scrolled = false;
        terminal.addEventListener("touchstart", (event) => {
          lastY = event.touches[0].clientY;
          scrolled = false;
        }, { capture: true, passive: true });
        terminal.addEventListener("touchmove", (event) => {
          if (lastY === null) return;
          const touch = event.touches[0];
          const rect = terminal.getBoundingClientRect();
          const { cols, rows } = window.storyTerminalSize;
          const rowHeight = rect.height / rows;
          const steps = Math.trunc((touch.clientY - lastY) / rowHeight);
          event.preventDefault();
          if (!steps) return;
          lastY += steps * rowHeight;
          scrolled = true;
          const col = Math.min(cols, Math.max(1, Math.ceil((touch.clientX - rect.left) / (rect.width / cols))));
          const row = Math.min(rows, Math.max(1, Math.ceil((touch.clientY - rect.top) / rowHeight)));
          const wheel = steps > 0 ? 64 : 65; // 手指往下滑＝往上捲（看前面的故事）
          send(["stdin", `\x1b[<${wheel};${col};${row}M`.repeat(Math.abs(steps))]);
        }, { capture: true, passive: false });
        terminal.addEventListener("touchend", (event) => {
          if (scrolled) event.preventDefault(); // 滑動結束時不要再算成一次點擊
          lastY = null;
        }, { capture: true, passive: false });

        function send(data) {
          const socket = window.storySocket;
          if (socket && socket.readyState === window.StoryWebSocket.OPEN) {
            socket.send(JSON.stringify(data));
          }
        }

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const text = field.value;
          field.value = "";
          // 點輸入列時終端機失去焦點，遊戲裡的輸入框也跟著失焦；先讓遊戲回到有焦點的狀態，文字才會進到輸入框
          send(["focus"]);
          if (text) {
            send(["stdin", "\x1b[200~" + text + "\x1b[201~"]); // 用「貼上」一次送出整段文字
          }
          send(["stdin", "\r"]);
        });
      })();
    </script>
  </body>
</html>
