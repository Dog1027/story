<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Story logo (also the favicon): an open book whose spine becomes a forking path, with one branch chosen -->
  <style>
    .tile { fill: #1f6f5c; }
    .mark { fill: #ffffff; stroke: #ffffff; }
    @media (prefers-color-scheme: dark) { .tile { fill: #5fbfa3; } .mark { fill: #0d1a16; stroke: #0d1a16; } }
  </style>
  <rect class="tile" x="1" y="1" width="30" height="30" rx="8"/>
  <g class="mark" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="0" d="M5.5 20.5c3.6-1.6 7.1-1.6 10.5 0.4v5.1c-3.4-2-6.9-2-10.5-0.4z"/>
    <path stroke-width="0" d="M26.5 20.5c-3.6-1.6-7.1-1.6-10.5 0.4v5.1c3.4-2 6.9-2 10.5-0.4z"/>
    <path fill="none" stroke-width="2.2" d="M16 19.5v-5.5M16 14l-3.8-4.3M16 14l5.4-6.1"/>
    <circle cx="21.4" cy="7.9" r="2.3" stroke-width="0"/>
    <circle cx="10.6" cy="7.9" r="1.7" fill="none" stroke-width="1.4"/>
  </g>
</svg>
