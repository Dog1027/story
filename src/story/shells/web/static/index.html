<!doctype html>
<html lang="{{html_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>{{title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap">
  <link rel="icon" href="/static/logo.svg?v=1" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v=26">
  <script>
    // Appearance: follow the system, or the light/dark choice the player made in the menu (stored only in this browser)
    try {
      const theme = localStorage.getItem("story-theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="bar">
        <span class="mark">
          <!-- The same mark as logo.svg, drawn with the page's colors so it follows the light/dark theme -->
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <rect class="logo-tile" x="1" y="1" width="30" height="30" rx="8"/>
            <g class="logo-ink" stroke-linecap="round" stroke-linejoin="round">
              <path stroke-width="0" d="M5.5 20.5c3.6-1.6 7.1-1.6 10.5 0.4v5.1c-3.4-2-6.9-2-10.5-0.4z"/>
              <path stroke-width="0" d="M26.5 20.5c-3.6-1.6-7.1-1.6-10.5 0.4v5.1c3.4-2 6.9-2 10.5-0.4z"/>
              <path fill="none" stroke-width="2.2" d="M16 19.5v-5.5M16 14l-3.8-4.3M16 14l5.4-6.1"/>
              <circle cx="21.4" cy="7.9" r="2.3" stroke-width="0"/>
              <circle cx="10.6" cy="7.9" r="1.7" fill="none" stroke-width="1.4"/>
            </g>
          </svg>
          Story
        </span>
        <span id="turn" class="turn"></span>
        <span id="mode" class="mode" hidden></span>
        <button id="menu-button" class="icon-button" type="button" aria-label="{{menu}}" aria-haspopup="true">⋯</button>
      </div>
      <div id="status" class="status"></div>
    </header>

    <main id="log" aria-live="polite"></main>

    <footer id="dock">
      <div id="timer" class="timer" hidden><div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div><span id="timer-text" class="timer-text"></span></div>
      <ol id="choices" class="choices"></ol>
      <form id="input-form" class="input-row" autocomplete="off">
        <input id="input" type="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="{{connecting}}" disabled>
        <button id="send" type="submit" class="send">{{send}}</button>
      </form>
    </footer>
  </div>

  <div id="menu" class="menu" hidden role="menu">
    <button type="button" data-command="/state" role="menuitem">{{menu_state}}</button>
    <button type="button" data-command="/restart" role="menuitem">{{menu_restart}}</button>
    <button type="button" data-local="help" role="menuitem">{{menu_help}}</button>
    <button type="button" data-local="rename" role="menuitem">{{menu_rename}}</button>
    <div class="menu-theme" role="group" aria-label="{{menu_theme}}">
      <span>{{menu_theme}}</span>
      <button type="button" data-theme-choice="system">{{theme_system}}</button>
      <button type="button" data-theme-choice="light">{{theme_light}}</button>
      <button type="button" data-theme-choice="dark">{{theme_dark}}</button>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="activity" class="activity" aria-live="polite"></div>

  <!-- Interface text (story/shells/ui/<lang>/dialogs.md, web.md): the server replaces names in double braces with this language's text; T is the whole string table -->
  <script>const T = {{texts}};</script>
  <!-- ?v= is a version number: bump it when app.js or style.css changes so browsers drop their cached copies -->
  <script src="/static/app.js?v=25"></script>
</body>
</html>
