<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap">
  <link rel="stylesheet" href="/static/style.css?v=2">
  <script>
    // 外觀：跟隨系統，或玩家在選單裡選的淺色／深色（只存在這個瀏覽器）
    try {
      const theme = localStorage.getItem("story-theme");
      if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="bar">
        <span class="mark">Story</span>
        <span id="turn" class="turn"></span>
        <span id="mode" class="mode" hidden></span>
        <button id="menu-button" class="icon-button" type="button" aria-label="選單" aria-haspopup="true">⋯</button>
      </div>
      <div id="status" class="status"></div>
    </header>

    <main id="log" aria-live="polite"></main>

    <footer id="dock">
      <div id="timer" class="timer" hidden><div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div><span id="timer-text" class="timer-text"></span></div>
      <div id="choices-title" class="choices-title" hidden></div>
      <ol id="choices" class="choices"></ol>
      <form id="input-form" class="input-row" autocomplete="off">
        <input id="input" type="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="連線中…" disabled>
        <button id="send" type="submit" class="send">送出</button>
      </form>
    </footer>
  </div>

  <div id="menu" class="menu" hidden role="menu">
    <button type="button" data-command="/state" role="menuitem">程式記住的東西</button>
    <button type="button" data-command="/restart" role="menuitem">重新開始</button>
    <button type="button" data-local="help" role="menuitem">說明</button>
    <div class="menu-theme" role="group" aria-label="外觀">
      <span>外觀</span>
      <button type="button" data-theme-choice="system">系統</button>
      <button type="button" data-theme-choice="light">淺色</button>
      <button type="button" data-theme-choice="dark">深色</button>
    </div>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
  </div>

  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <!-- ?v= 是版本號：app.js、style.css 跟伺服器之間的訊息格式改了就加一，瀏覽器才會丟掉快取的舊檔 -->
  <script src="/static/app.js?v=2"></script>
</body>
</html>
